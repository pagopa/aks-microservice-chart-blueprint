microservice-chart:
  namespace: "testit"

  deployment:
    create: true

  serviceAccount:
    name: testit-workload-identity

  azure:
    workloadIdentityEnabled: true
    workloadIdentityClientId: "11111111-1111-1111-1111-111111111111"

  image:
    repository: ghcr.io/pagopa/devops-java-springboot-color
    tag: latest
    pullPolicy: Always

  livenessProbe:
    httpGet:
      path: /status/live
      port: 8080
    initialDelaySeconds: 30
    failureThreshold: 6
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /status/ready
      port: 8080
    initialDelaySeconds: 30
    failureThreshold: 6
    periodSeconds: 10

  service:
    create: true
    type: ClusterIP
    ports:
      - 8080

  ingress:
    create: true
    host: testit.itn.internal.devopslab.pagopa.it
    path: /testit/v8-keda-multiple-trigger-auth-test(/|$)(.*)
    rewriteTarget: /$2
    servicePort: 8080

  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "300m"

  autoscaling:
    enable: true
    minReplica: 0
    maxReplica: 3
    pollingInterval: 30 # seconds
    cooldownPeriod: 10 # seconds
    triggerAuthentications:
      - name: azure-monitor-auth
        workloadIdentity:
          provider: azure-workload
          identityId: "11111111-1111-1111-1111-111111111111"
      - name: queue-auth
        secretTargetRef:
          - parameter: connection
            name: workload-secrets
            key: queueConnectionString
    triggers:
      - type: cpu
        metadata:
          type: Utilization
          value: "60"
      - type: azure-monitor
        authenticationRef:
          name: azure-monitor-auth
        metadata:
          tenantId: 7788edaf-0346-4068-9d79-c868aed15b3d
          subscriptionId: ac17914c-79bf-48fa-831e-1359ef74c1d5
          resourceGroupName: dvopla-d-sec-rg
          resourceURI: Microsoft.KeyVault/vaults/dvopla-d-neu-kv
          metricName: ServiceApiHit
          metricAggregationType: Count
          targetValue: "30"
      - type: azure-queue
        authenticationRef:
          name: queue-auth
        metadata:
          queueName: my-queue
          queueLength: "5"

  podDisruptionBudget:
    create: false
    minAvailable: 1

  keyvault:
    name: "dvopla-d-itn-testit-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
