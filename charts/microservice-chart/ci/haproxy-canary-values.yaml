# HAProxy ingress with an inline canary Deployment routed by header and weight.
# canaryDelivery.image/envConfig/envSecret are set explicitly at canaryDelivery level (see BP-02).
image:
  repository: ghcr.io/pagopa/devops-java-springboot-color
  tag: "1.0.0"

azure:
  workloadIdentityClientId: "11111111-1111-1111-1111-111111111111"

keyvault:
  name: testit-kv
  tenantId: "22222222-2222-2222-2222-222222222222"

envConfig:
  COLOR: "green"

envSecret:
  MY_KV_SECRET: my-kv-secret

# nginx and HAProxy ingresses together: the nginx Ingress must stay a regular (non canary) Ingress
ingress:
  create: true
  host: testit.itn.internal.devopslab.pagopa.it
  path: /testit/foo(/|$)(.*)
  rewriteTarget: /$2
  haproxy:
    create: true
    host: testit.itn.internal.devopslab.pagopa.it
    path: /testit/foo
    rewriteTarget: /

canaryDelivery:
  create: true
  ingress:
    header: true
    headerName: X-Canary
    headerValue: enabled
    weightPercent: 20
  image:
    repository: ghcr.io/pagopa/devops-java-springboot-color
    tag: "1.1.0"
  envConfig:
    COLOR: "blue"
  envSecret: {}
