# Legacy nginx canary: this release runs the canary image behind a canary ingress.
image:
  repository: ghcr.io/pagopa/devops-java-springboot-color
  tag: "1.0.0"

azure:
  workloadIdentityClientId: "11111111-1111-1111-1111-111111111111"

keyvault:
  name: testit-kv
  tenantId: "22222222-2222-2222-2222-222222222222"

envConfig:
  COLOR: "green"

envSecret:
  MY_KV_SECRET: my-kv-secret

ingress:
  create: true
  host: testit.itn.internal.devopslab.pagopa.it
  path: /testit/foo(/|$)(.*)
  rewriteTarget: /$2

canaryDelivery:
  create: true
  ingress:
    header: true
    headerName: X-Canary
    headerValue: enabled
    weightPercent: 10
  image:
    repository: ghcr.io/pagopa/devops-java-springboot-color
    tag: "1.1.0"
  envConfig:
    COLOR: "blue"
  envSecret: {}
