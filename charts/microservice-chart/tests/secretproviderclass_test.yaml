suite: secret provider class
templates:
  - templates/secretproviderclass-kv.yaml
release:
  name: myapp
  namespace: testit
chart:
  version: 0.0.0-test
set:
  azure.workloadIdentityClientId: 11111111-1111-1111-1111-111111111111
  keyvault.name: my-kv
  keyvault.tenantId: 22222222-2222-2222-2222-222222222222
tests:
  - it: is not rendered when secretProviderClass.create is false
    set:
      secretProviderClass.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when there are no secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: configures the Key Vault and the workload identity
    set:
      envSecret:
        DB_PASSWORD: db-password
    asserts:
      - isKind:
          of: SecretProviderClass
      - equal:
          path: spec.provider
          value: azure
      - isSubset:
          path: spec.parameters
          content:
            usePodIdentity: "false"
            clientID: 11111111-1111-1111-1111-111111111111
            keyvaultName: my-kv
            tenantId: 22222222-2222-2222-2222-222222222222

  - it: syncs envSecret and initContainerEnvSecret into the Kubernetes secret
    set:
      envSecret:
        DB_PASSWORD: db-password
      initContainerEnvSecret:
        INIT_TOKEN: init-token
    asserts:
      - equal:
          path: spec.secretObjects[0].secretName
          value: myapp-microservice-chart
      - equal:
          path: spec.secretObjects[0].data
          value:
            - key: db-password
              objectName: db-password
            - key: init-token
              objectName: init-token
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: db-password"
      - matchRegex:
          path: spec.parameters.objects
          pattern: "objectName: init-token"

  - it: includes canary secrets when canary delivery is enabled
    set:
      envSecret:
        DB_PASSWORD: db-password
      canaryDelivery.create: true
      canaryDelivery.envSecret:
        NEW_SECRET: new-secret
    asserts:
      - equal:
          path: spec.secretObjects[0].data
          value:
            - key: db-password
              objectName: db-password
            - key: new-secret
              objectName: new-secret

  - it: quotes empty Key Vault and workload identity parameters instead of rendering null
    set:
      azure.workloadIdentityClientId: ""
      keyvault.name: ""
      keyvault.tenantId: ""
      envSecret:
        DB_PASSWORD: db-password
    asserts:
      - isSubset:
          path: spec.parameters
          content:
            clientID: ""
            keyvaultName: ""
            tenantId: ""

  - it: loads a Key Vault secret only once when it is referenced more than once
    set:
      envSecret:
        DB_PASSWORD: db-password
        DATABASE_PASSWORD: db-password
      initContainerEnvSecret:
        INIT_DB_PASSWORD: db-password
        INIT_TOKEN: init-token
      providedVolumeMount:
        create: true
        envSecret:
          STORAGE_KEY: db-password
    asserts:
      - equal:
          path: spec.secretObjects[0].data
          value:
            - key: db-password
              objectName: db-password
            - key: init-token
              objectName: init-token
      - equal:
          path: spec.parameters.objects
          value: |
            array:
              - |
                objectName: db-password
                objectType: secret
                objectVersion: ""
              - |
                objectName: init-token
                objectType: secret
                objectVersion: ""

  - it: is rendered when only initContainerEnvSecret is set
    set:
      initContainerEnvSecret:
        INIT_TOKEN: init-token
    asserts:
      - hasDocuments:
          count: 1

  - it: is rendered with canary secrets only
    set:
      canaryDelivery.create: true
      canaryDelivery.envSecret:
        NEW_SECRET: new-secret
    asserts:
      - equal:
          path: spec.secretObjects[0].data
          value:
            - key: new-secret
              objectName: new-secret

  - it: does not count providedVolumeMount secrets when providedVolumeMount is disabled
    set:
      providedVolumeMount:
        create: false
        envSecret:
          STORAGE_KEY: storage-key
    asserts:
      - hasDocuments:
          count: 0
