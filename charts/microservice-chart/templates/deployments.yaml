{{- if .Values.deployment.create -}}
{{- $root := . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice-chart.fullname" . }}
  namespace: {{ include "microservice-chart.namespace" . }}
  labels:
    {{- include "microservice-chart.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
{{- $replicas := .Values.deployment.replicas }}
{{- if kindIs "invalid" $replicas }}
{{- $replicas = 1 }}
{{- end }}
{{- if .Values.autoscaling.enable }}
{{- $replicas = default .Values.autoscaling.minReplica .Values.deployment.replicas }}
{{- $namespace := include "microservice-chart.namespace" . }}
{{- $cur := lookup "apps/v1" "Deployment" $namespace (include "microservice-chart.fullname" .) }}
{{- if and .Release.IsUpgrade (hasKey ($cur.spec | default dict) "replicas") }}
{{- $replicas = $cur.spec.replicas }}
{{- end }}
{{- end }}
spec:
  revisionHistoryLimit: {{ default 10 .Values.deployment.revisionHistoryLimit }}
  replicas: {{ int $replicas }}
  selector:
    matchLabels:
      {{- include "microservice-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- if .Values.deployment.forceRedeploy }}
        redeploy: {{ now | unixEpoch | quote }}
        {{- end }}
        {{- include "microservice-chart.selectorLabels" . | nindent 8 }}
        {{- include "microservice-chart.extraLabels" . | nindent 8 }}
        critical: {{ .Values.critical | quote }}
    spec:
      {{- if hasKey .Values.deployment "ndots" }}
      dnsConfig:
        options:
          - name: ndots
            value: {{ .Values.deployment.ndots | quote }}
      {{- end }}
      {{- if (gt (len .Values.deployment.hostAliases) 0) }}
      hostAliases:
        {{- toYaml .Values.deployment.hostAliases | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.topologySpreadConstraints }}
      {{- if and .create (or .useDefaultConfiguration (gt (len .config) 0)) }}
      topologySpreadConstraints:
        {{- if .useDefaultConfiguration }}
        {{- include "microservice-chart.defaultTopologySpreadConstraints" $root | nindent 8 }}
        {{- else if .config }}
        {{- toYaml .config | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "microservice-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if and .Values.canaryDelivery.create (not .Values.ingress.haproxy.create) }}
          image: "{{ .Values.canaryDelivery.image.repository }}:{{ .Values.canaryDelivery.image.tag | default .Chart.AppVersion }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
          {{- range .Values.service.ports }}
            - name: app-port-{{ . }}
              containerPort: {{ . }}
              protocol: TCP
          {{- end }}
          {{- if not (empty .Values.container.command) }}
          command:
            {{- toYaml .Values.container.command | nindent 12 }}
          {{- end}}
          {{- if not (empty .Values.container.args) }}
          args:
            {{- toYaml .Values.container.args | nindent 12 }}
          {{- end}}
          #
          # PROBES
          #
          ### LIVENESS
          {{- if .Values.livenessProbe.create }}
          livenessProbe:
            {{- if eq .Values.livenessProbe.handlerType "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.livenessProbe.tcpSocket.port }}
            {{ else if eq .Values.livenessProbe.handlerType "exec" }}
            exec:
              command:
                {{- toYaml .Values.livenessProbe.exec.command | nindent 16 }}
            {{- else }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            {{- end}}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            terminationGracePeriodSeconds: {{ .Values.livenessProbe.terminationGracePeriodSeconds }}

          {{- end}}
          ### READINESS
          {{- if .Values.readinessProbe.create }}
          readinessProbe:
            {{- if eq .Values.readinessProbe.handlerType "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.readinessProbe.tcpSocket.port }}
            {{ else if eq .Values.readinessProbe.handlerType "exec" }}
            exec:
              command:
                {{- toYaml .Values.readinessProbe.exec.command | nindent 16 }}
            {{- else }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            {{- end}}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end}}
          ### STARTUP
          {{- if .Values.startupProbe.create }}
          startupProbe:
            {{- if eq .Values.startupProbe.handlerType "tcpSocket" }}
            tcpSocket:
              port: {{ .Values.startupProbe.tcpSocket.port }}
            {{ else if eq .Values.startupProbe.handlerType "exec" }}
            exec:
              command:
                {{- toYaml .Values.startupProbe.exec.command | nindent 16 }}
            {{- else }}
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.startupProbe.httpGet.port }}
            {{- end}}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
            terminationGracePeriodSeconds: {{ .Values.startupProbe.terminationGracePeriodSeconds }}
          {{- end}}
          #
          # LIFECYCLE
          #
          {{ if .Values.lifecycle.preStop.create }}
          lifecycle:
            preStop:
              exec:
                command:
                  {{ toYaml .Values.lifecycle.preStop.command | nindent 18 }}
          {{ end }}
          #
          # RESOURCE
          #
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            #<tmp folders>
            {{- if .Values.tmpVolumeMount.create }}
            {{- range $i, $val := .Values.tmpVolumeMount.mounts }}
            - name: {{ $val.name }}
              mountPath: {{ $val.mountPath }}
            {{- end }}
            {{- end }}
            #</tmp folder>
            #<pvc mount>
            {{- if .Values.persistentVolumeClaimsMounts.create }}
            {{- range $i, $val := .Values.persistentVolumeClaimsMounts.mounts }}
            - name: {{ $val.name }}
              mountPath: {{ $val.mountPath }}
            {{- end }}
            {{- end }}
            #</pvc mount>
            {{- if include "microservice-chart.secretProviderClass.enabled" . }}
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            {{- end }}
            {{- if .Values.configMapFromFile }}
            {{- range $key, $val := .Values.configMapFromFile }}
            - name: file-config
              mountPath: "{{ $root.Values.configMapFromFileCustomPath }}/{{ $key }}"
              subPath: {{ $key }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.externalConfigMapFiles.create }}
            {{- range $i, $v := .Values.externalConfigMapFiles.configMaps }}
            - name: {{ $v.name }}-{{ $i }}
              {{- if $v.mountPath }}
              mountPath: "{{ $v.mountPath }}"
              {{- else }}
              mountPath: "{{ $root.Values.externalConfigMapFilesCustomPath}}/{{ $v.name }}/{{ $v.key }}"
              {{- end }}
              subPath: {{ $v.key }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.providedVolumeMount.create }}
            {{- range $i, $v := .Values.providedVolumeMount.folders }}
            - name: file-azure-{{ $v.name }}
              mountPath: "/mnt/file-azure/{{ $v.name }}"
            {{- end }}
            {{- end }}
            #<azureFile mount>
            {{- if .Values.azureFile.create }}
            {{- range $i, $val := .Values.azureFile.mounts }}
            {{- if $val.mountPath }}
            - name: {{ $val.name }}
              mountPath: {{ $val.mountPath | quote }}
              readOnly: {{ $val.readOnly | default false }}
            {{- end }}
            {{- end }}
            {{- end }}
            #</azureFile mount>
          env:
            #envConfig
            {{- if and .Values.canaryDelivery.create (not .Values.ingress.haproxy.create) }}
            {{- range $key, $val := (mergeOverwrite (deepCopy (.Values.envConfig | default dict)) (.Values.canaryDelivery.envConfig | default dict)) }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- else }}
            {{- range $key, $val :=.Values.envConfig }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            # Secret provider class
            {{- if or .Values.secretProviderClass.create }}
            {{- if and .Values.canaryDelivery.create (not .Values.ingress.haproxy.create) }}
            {{- range $name, $value := (mergeOverwrite (deepCopy (.Values.envSecret | default dict)) (.Values.canaryDelivery.envSecret | default dict)) }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: {{ $value }}
            {{- end }}
            {{- else }}
            {{- range $name, $value := .Values.envSecret }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: {{ $value }}
            {{- end }}
            {{- end }}
            {{- end }}
            #envConfig CANARY
            {{- if and .Values.canaryDelivery.create (not .Values.ingress.haproxy.create) }}
            - name: CANARY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: CANARY
            {{- end }}
            #envFieldRef
            {{- range $key, $val := .Values.envFieldRef }}
            - name: {{ $key }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $val }}
            {{- end }}
            #external configmap values
            {{- range $key, $valMap := .Values.externalConfigMapValues }}
            {{- if kindIs "map" $valMap }}
            {{- range $internKey, $internVal := $valMap }}
            - name: {{ $internKey }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $key }}
                  key: {{ $internVal | toString | quote }}
            {{- end }}
            {{- else if $valMap }}
            {{- fail (printf "externalConfigMapValues.%s must map each env var name to a key of the config map %s, e.g. {DATABASE_DB_NAME: database-db-name} (see README externalConfigMapValues)" $key $key) }}
            {{- end }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if and .Values.imagePullSecrets (kindIs "map" .Values.imagePullSecrets) -}}
      {{- if .Values.imagePullSecrets.name }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name }}
      {{- end }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- range $i, $init := .Values.initContainers }}
        {{- $image := $init.image | default dict }}
        {{- $tmpVolumeMount := $init.tmpVolumeMount | default dict }}
        - name: {{ required (printf "initContainers[%d].name is required" $i) $init.name }}
          image: "{{ required (printf "initContainers[%d].image.repository is required" $i) $image.repository }}{{ with $image.tag }}:{{ . }}{{ end }}"
        {{- with $image.pullPolicy }}
          imagePullPolicy: {{ . }}
        {{- end }}
          {{- if not (empty $init.command) }}
          command:
            {{- toYaml $init.command | nindent 12 }}
          {{- end }}
          {{- if not (empty $init.args) }}
          args:
            {{- toYaml $init.args | nindent 12 }}
          {{- end }}
          {{- with $init.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $init.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $.Values.initContainerEnvConfig (and $.Values.secretProviderClass.create $.Values.initContainerEnvSecret) $init.env }}
          env:
            #initContainerEnvConfig
          {{- range $key, $val := $.Values.initContainerEnvConfig }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}-init
                  key: {{ $key }}
          {{- end }}
            #initContainerEnvSecret
          {{- if $.Values.secretProviderClass.create }}
            {{- range $name, $value := $.Values.initContainerEnvSecret }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice-chart.fullname" $ }}
                  key: {{ $value }}
            {{- end }}
          {{- end }}
            {{- with $init.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or (and $tmpVolumeMount.create $tmpVolumeMount.mounts) $init.volumeMounts }}
          volumeMounts:
            {{- if $tmpVolumeMount.create }}
            {{- range $tmpVolumeMount.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- end }}
            {{- with $init.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      volumes:
        #<tmp volume>
        {{- if .Values.tmpVolumeMount.create }}
        {{- range $i, $val := .Values.tmpVolumeMount.mounts }}
        - name: {{ $val.name }}
          emptyDir: {}
        {{- end }}
        {{- end }}
        #</tmp volume>
        # <pvc volume>
        {{- if .Values.persistentVolumeClaimsMounts.create }}
        {{- range $i, $val := .Values.persistentVolumeClaimsMounts.mounts }}
        - name: {{ $val.name }}
          persistentVolumeClaim:
            claimName: {{ $val.pvcName }}
        {{- end }}
        {{- end }}
        # </pvc volume>
        # <provided>
        {{- if .Values.providedVolumeMount.create }}
        {{- range $i, $v := .Values.providedVolumeMount.folders }}
        - name: file-azure-{{ $v.name }}
          csi:
            driver: file.csi.azure.com
            readOnly: {{ $v.readOnly }}
            volumeAttributes:
              secretName: {{ include "microservice-chart.fullname" $ }}
              shareName: {{ $v.name }}
              mountOptions: {{ $v.mountOptions }}
        {{- end }}
        {{- end }}
        {{- if include "microservice-chart.secretProviderClass.enabled" . }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "microservice-chart.fullname" $ }}
        {{- end }}
        {{- if .Values.configMapFromFile }}
        - name: file-config
          configMap:
            name: {{ include "microservice-chart.fullname" $ }}
            defaultMode: 420
            items:
          {{- range $key, $val := .Values.configMapFromFile }}
              - key: {{ $key }}
                path: {{ $key }}
          {{- end }}
        {{- end }}
        {{- if .Values.externalConfigMapFiles.create }}
        {{- range $i, $v := .Values.externalConfigMapFiles.configMaps }}
        - name: {{ $v.name }}-{{ $i }}
          configMap:
            name: {{ $v.name }}
            defaultMode: 420
            items:
              - key: {{ $v.key }}
                path: {{ $v.key }}
        {{- end }}
        {{- end }}
        #<azureFile volume>
        {{- if .Values.azureFile.create }}
        {{- range $i, $val := .Values.azureFile.mounts }}
        - name: {{ required (printf "azureFile.mounts[%d].name is required" $i) $val.name }}
          azureFile:
            secretName: {{ $.Values.azureFile.secretName | default (printf "%s-azure-file" (include "microservice-chart.fullname" $)) }}
            shareName: {{ required (printf "azureFile.mounts[%d].shareName is required" $i) $val.shareName }}
            readOnly: {{ $val.readOnly | default false }}
        {{- end }}
        {{- end }}
        #</azureFile volume>
      restartPolicy: {{ .Values.restartPolicy }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
       {{- include "microservice-chart.nodeSelectorBlock" . | nindent 6 }}
       {{- include "microservice-chart.affinityBlock" . | nindent 6 }}
      {{- include "microservice-chart.tolerationsBlock" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
