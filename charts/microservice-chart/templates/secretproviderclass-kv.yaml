{{- if include "microservice-chart.secretProviderClass.enabled" . -}}
{{- $objects := include "microservice-chart.secretProviderClass.objects" . | fromJsonArray -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "microservice-chart.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice-chart.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "microservice-chart.fullname" $ }}
      type: Opaque
      data:
      {{- range $objects }}
        - key: {{ . }}
          objectName: {{ . }}
      {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyvault.name | quote }}
    tenantId: {{ .Values.keyvault.tenantId | quote }}
    cloudName: ""
    objects: |
      array:
        {{- range $objects }}
        - |
          objectName: {{ . }}
          objectType: secret
          objectVersion: ""
        {{- end }}
{{- end }}
